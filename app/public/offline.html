<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão | Healthy Safely</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
      }

      .container {
        text-align: center;
        max-width: 450px;
        padding: 30px;
      }

      img {
        width: 120px;
        margin-bottom: 25px;
      }

      h1 {
        margin-bottom: 15px;
      }

      p {
        color: #666;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      button {
        cursor: pointer;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 16px;
        background: #5bbf6a;
        color: white;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/imagem/Logo repaginado 2.webp" />

      <h1>Você está offline</h1>

      <p>
        Não foi possível conectar à internet. Assim que a conexão voltar, você
        poderá continuar utilizando o Healthy Safely normalmente.
      </p>

      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
